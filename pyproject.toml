[project]
name = "bazaar-workspace"
version = "0.1.0"
description = "Workspace root for Bazaar: a market service and two trading agents."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["services"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
