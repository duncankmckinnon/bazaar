[project]
name = "bazaar-market"
version = "0.1.0"
description = "Simulated commodity market: prices, accounts, transaction history."
requires-python = ">=3.12"
dependencies = [
    "bazaar-protocol",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[tool.uv.sources]
bazaar-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_market"]
