[project]
name = "bazaar-web"
version = "0.1.0"
description = "Conference web service: strategy submissions, run queue and live board API."
requires-python = ">=3.12"
dependencies = [
    "bazaar-protocol",
    "bazaar-replay",
    "bazaar-runner",
    "fastapi>=0.115",
    "logfire>=5.1.1",
    "opentelemetry-api",
    "uvicorn>=0.30",
]

[tool.uv.sources]
bazaar-protocol = { workspace = true }
bazaar-replay = { workspace = true }
bazaar-runner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_web"]
