<style>
@font-face { font-family: "Dwight"; src: url("/fonts/DwightMedium.woff2") format("woff2"); font-weight: 500; font-display: swap; }

/* Brand tokens (pydantic/brand). */
:root {
  color-scheme: dark;
  --sugar: #FBFFEA; --darkpurple: #36182D; --blackbean: #061314;
  --pyai-magenta: #E320E7; --pyai-cyan: #00FFEB; --pyai-yellow: #D0FF71;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --pixel: "Press Start 2P", "IBM Plex Mono", ui-monospace, monospace;
  --u: min(1vw, 1.7778vh);
}
html, body { height: 100%; }
body { margin: 0; background: var(--darkpurple); font-family: var(--sans); }
*, *::before, *::after { box-sizing: border-box; }
.num { font-variant-numeric: tabular-nums; }
.qr svg { display: block; width: 100%; height: auto; }
.qr .qr-fallback { font: 500 12px/1.4 var(--mono); word-break: break-all; padding: 8px; color: var(--darkpurple); }
.logo svg { display: block; width: 100%; height: auto; }
@keyframes blink { 50% { opacity: 0; } }

/* Arcade layout on the podium background. */
.p-arcade { position: fixed; inset: 0; overflow: hidden; color: var(--sugar);
  background: radial-gradient(60% 70% at 50% 18%, rgba(229,32,233,.30) 0%, rgba(229,32,233,0) 60%), radial-gradient(50% 60% at 90% 100%, rgba(255,101,80,.16) 0%, rgba(255,101,80,0) 60%), #36182D;
  display: grid; grid-template-columns: minmax(0,1fr) calc(var(--u)*28); gap: calc(var(--u)*4); padding: calc(var(--u)*2.6) calc(var(--u)*4); }
.p-arcade::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 2px, rgba(0,0,0,0) 2px 4px); mix-blend-mode: multiply; z-index: 4; }
.ar-main { min-height: 0; display: flex; flex-direction: column; }
.ar-title { font: 400 calc(var(--u)*3.4)/1.2 var(--pixel); margin: 0; color: var(--pyai-yellow); text-shadow: calc(var(--u)*.3) calc(var(--u)*.3) 0 var(--pyai-magenta); letter-spacing: .04em; }
.ar-sub { font: 400 calc(var(--u)*.9)/1.6 var(--pixel); color: var(--pyai-cyan); margin: calc(var(--u)*1.2) 0 calc(var(--u)*1.8); }
.ar-cols, .ar-row { display: grid; grid-template-columns: calc(var(--u)*6.5) calc(var(--u)*15) minmax(0,1fr) calc(var(--u)*11); gap: calc(var(--u)*1.6); align-items: center; }
.ar-cols { font: 400 calc(var(--u)*.85)/1 var(--pixel); color: #b48fa8; padding: 0 calc(var(--u)*.8) calc(var(--u)*1); }
.ar-cols span:nth-child(4) { text-align: right; }
.ar-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.ar-row { padding: calc(var(--u)*.72) calc(var(--u)*.8); font: 400 calc(var(--u)*1.35)/1.2 var(--pixel); color: var(--c, var(--sugar)); }
.ar-row .nm { font: 700 calc(var(--u)*1.5)/1.2 var(--mono); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-row .nm a { color: inherit; text-decoration: none; cursor: pointer; }
.ar-row .rt { text-align: right; font-size: calc(var(--u)*1.05); white-space: nowrap; }
.ar-row.st-running, .ar-row.st-queued { --c: #d9c4d3; }
.ar-row.st-running .rt { color: var(--pyai-cyan); animation: blink 1s steps(1) infinite; }
.ar-row.st-queued .rt { color: #b48fa8; }
.ar-row .sc.prov { opacity: .7; }
.ar-row.new .nm::after { content: "NEW"; margin-left: .8em; font: 400 calc(var(--u)*.8)/1 var(--pixel); color: var(--blackbean); background: var(--pyai-yellow); padding: .3em .5em; animation: blink .5s steps(1) 16; }
.empty { font: 400 calc(var(--u)*1.4)/1.6 var(--pixel); color: var(--pyai-yellow); text-transform: uppercase; padding: calc(var(--u)*3) calc(var(--u)*.8); }
.ar-side { min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u)*1.8); align-items: stretch; }
.ar-side .logo { --logo-text: var(--sugar); --logo-mark: var(--pyai-magenta); filter: drop-shadow(0 0 calc(var(--u)*1.2) rgba(227,32,231,.45)); }
.ar-coin { font: 400 calc(var(--u)*1.25)/1.5 var(--pixel); color: var(--pyai-yellow); text-align: center; animation: blink 1.1s steps(1) infinite; }
.ar-qr { background: var(--sugar); padding: calc(var(--u)*1.2); border: calc(var(--u)*.4) solid var(--pyai-cyan); box-shadow: 0 0 0 calc(var(--u)*.4) var(--darkpurple), 0 0 0 calc(var(--u)*.8) var(--pyai-magenta); }
.ar-side p { font: 400 calc(var(--u)*.85)/1.8 var(--pixel); color: #e6cfe0; margin: 0; text-align: center; }
.ar-side .url { font: 500 calc(var(--u)*.85)/1.3 var(--mono); color: #c9a9bf; word-break: break-all; }
.ar-ticker { margin-top: auto; border-top: 2px solid rgba(251,255,234,.18); padding-top: calc(var(--u)*1.2); font: 400 calc(var(--u)*.9)/1.7 var(--pixel); color: var(--pyai-cyan); min-height: 3.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-ticker .cur { display: inline-block; width: .7em; height: 1em; background: currentColor; vertical-align: -.15em; animation: blink 1s steps(1) infinite; }
.conn { position: fixed; top: calc(var(--u)*1); right: calc(var(--u)*1.2); z-index: 5; font: 400 calc(var(--u)*.7)/1 var(--pixel); color: #FF6550; }
.conn[hidden] { display: none; }

@media (max-width: 760px) {

@media (prefers-reduced-motion: reduce) {

<body>
<section class="p-arcade">

<script>
(() => {
"use strict";

const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2,.8,.2,1)";
const DAYS = 10;

const NEW_MS = 8000;
const POLL_MS = 2000;
const COLORS = ["#D0FF71", "#00FFEB", "#E320E7", "#FBFFEA"];

/* ---------- brand marks (pydantic/brand pydantic-name-dark.svg) ---------- */
const TEXT_D = "M178.25 93.2v-76h32.665c7.04 0 12.485 2.065 16.33 6.2 3.85 4.14 5.775 9.695 5.775 16.665 0 6.97-1.925 12.52-5.775 16.66-3.85 4.135-9.29 6.205-16.33 6.205H190.55V93.2h-12.3Zm12.3-41.05h19.6c3.125 0 5.55-.8 7.3-2.395 1.74-1.67 2.61-4.03 2.61-7.08V37.45c0-3.05-.87-5.37-2.615-6.97-1.74-1.67-4.17-2.5-7.295-2.5h-19.6v24.17Zm89.835-15.575h11.43l-23.845 67.84c-.65 1.885-1.415 3.485-2.285 4.79a9.895 9.895 0 0 1-2.94 3.265 9.846 9.846 0 0 1-4.03 1.85c-1.6.44-3.485.655-5.66.655h-6.86v-9.69h9.58l3.265-9.58-20.58-59.13h11.87l11.325 33.32L264.92 82.2h.55l3.59-12.3 11.325-33.325Zm56.185 47.26h-.545a15.682 15.682 0 0 1-6.1 7.84c-2.755 1.885-6.02 2.83-9.8 2.83-7.185 0-12.735-2.575-16.655-7.73-3.92-5.225-5.88-12.52-5.88-21.885 0-9.365 1.96-16.625 5.88-21.78 3.92-5.225 9.47-7.84 16.655-7.84 3.775 0 7.045.945 9.8 2.83 2.835 1.815 4.865 4.43 6.1 7.84h.545V12.62h11.87V93.2h-11.87v-9.365Zm-12.85.435c3.63 0 6.68-.87 9.15-2.615 2.465-1.81 3.7-4.17 3.7-7.075V55.195c0-2.9-1.235-5.225-3.7-6.965-2.47-1.815-5.52-2.725-9.15-2.725-4.135 0-7.44 1.345-9.91 4.03-2.465 2.615-3.7 6.1-3.7 10.45v9.8c0 4.36 1.235 7.88 3.7 10.565 2.47 2.615 5.775 3.92 9.91 3.92Zm83.19 8.93c-3.12 0-5.515-.87-7.185-2.61-1.67-1.815-2.685-4.1-3.05-6.86h-.545c-1.09 3.555-3.085 6.24-5.99 8.055-2.9 1.815-6.425 2.725-10.56 2.725-5.88 0-10.415-1.525-13.61-4.575-3.12-3.05-4.685-7.15-4.685-12.3 0-5.665 2.035-9.915 6.1-12.745 4.135-2.83 10.16-4.25 18.075-4.25h10.235v-4.785c0-3.485-.945-6.17-2.83-8.06-1.89-1.885-4.83-2.83-8.82-2.83-3.34 0-6.06.725-8.165 2.175-2.11 1.45-3.885 3.305-5.34 5.555l-7.075-6.425a22.24 22.24 0 0 1 7.95-7.84c3.41-2.1 7.875-3.155 13.39-3.155 7.335 0 12.96 1.7 16.88 5.115 3.92 3.415 5.88 8.315 5.88 14.7v28.42h5.99v9.69h-6.645Zm-23.95-7.73c3.7 0 6.75-.8 9.14-2.395 2.4-1.67 3.6-3.885 3.6-6.64v-8.17h-10.025c-8.2 0-12.3 2.54-12.3 7.625v1.96c0 2.54.835 4.465 2.5 5.77 1.745 1.235 4.105 1.85 7.085 1.85Zm42.245 7.73V36.58h11.87v9.365h.545a18.87 18.87 0 0 1 5.55-7.625c2.54-2.03 5.99-3.05 10.35-3.05 5.8 0 10 const LOGO_SVG = `<svg viewBox="0 0 605 120" role="img" aria-label="Pydantic"><path fill="var(--logo-text)" d="${TEXT_D}"/><path fill="var(--logo-mark)" d="${MARK_D}"/></svg>`;

/* ---------- formatting: the API sends percent units (0.6 means +0.60%) ---------- */
// ASCII "-": Press Start 2P has no U+2212.
const pct = (v) => (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toFixed(2) + "%";
const money = (v) => (v < 0 ? "-$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ordinal = (n) => ["1ST", "2ND", "3RD"][n - 1] || n + "TH";
const safeUrl = (u) => typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
function setName(b, name, url) {
  // No link: plain text, exactly as before (this also drops a link the row used to have).
  if (!url) { b.textContent = name; return; }
  let a = b.firstElementChild;
  if (!a || a.tagName !== "A") {
    b.textContent = "";
    a = document.createElement("a");
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    b.appendChild(a);
  }
  a.setAttribute("href", url);
  a.textContent = name;
}

/* ---------- animation helpers ---------- */
function reconcile(list, items, make, update) {
  const old = new Map();
  for (const el of list.children) if (el.dataset.k) old.set(el.dataset.k, el);
  const first = new Map();
  if (!RM) old.forEach((el, k) => first.set(k, el.getBoundingClientRect()));
  const keep = new Set();
  items.forEach((it, i) => {
    let el = old.get(it.id);
    if (!el) { el = make(it); el.dataset.k = it.id; el._new = true; }
    update(el, it, i);
    const at = list.children[i];
    if (at !== el) list.insertBefore(el, at || null);
    keep.add(it.id);
  });
  for (const el of [...list.children]) if (!el.dataset.k || !keep.has(el.dataset.k)) el.remove();
  for (const el of list.children) {
    if (el._new) { el._new = false; if (!RM && list.offsetParent) el.animate([{ opacity: 0, transform: "translateY(24px) scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 750, easing: EASE }); continue; }
    if (RM) continue;
    const f = first.get(el.dataset.k); if (!f) continue;
    const l = el.getBoundingClientRect();
    const dx = f.left - l.left, dy = f.top - l.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 850, easing: EASE });

function countTo(el, to, fmt) {

  if (RM || from === to || !el.offsetParent) { el.textContent = fmt(to); return; }

  cancelAnimationFrame(el._raf);
  const step = (t) => { const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };

/* ---------- QR ---------- */
function qrSVG(url, fg, mark) {
  if (typeof qrcode !== "function") return `<div class="qr-fallback">${esc(url)}</div>`;
  const q = qrcode(0, "H"); q.addData(url); q.make();
  const n = q.getModuleCount(), pad = 2, size = n + pad * 2;
  const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);

  const inHole = (r, c) => r >= h0 && r < h0 + hole && c >= h0 && c < h0 + hole;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c) && !finder(r, c) && !inHole(r, c)) d += `M${c + pad + .08} ${r + pad + .08}h.84v.84h-.84z`;

/* ---------- render ---------- */
const $ = (id) => document.getElementById(id);
const list = $("list"), ticker = $("ticker"), conn = $("conn");
$("logo").innerHTML = LOGO_SVG;
$("qr").innerHTML = qrSVG(SUBMIT_URL, "#36182D", "#E320E7");
$("url").textContent = SUBMIT_URL.replace(/^https?:\/\//, "");

const lastStatus = new Map(), newUntil = new Map();
let typed = "", target = "", typeTimer = 0;
function type() {
  clearTimeout(typeTimer);
  if (RM) { ticker.textContent = target; return; }
  if (typed.length < target.length) { typed = target.slice(0, typed.length + 1); ticker.textContent = typed; typeTimer = setTimeout(type, 28); }
}

function render(data) {
  const start = data.window && typeof data.window.starting_cash === "number" ? data.window.starting_cash : 10000;
  const all = Array.isArray(data.rows) ? data.rows : [];
  const now = Date.now();
  for (const r of all) {
    const id = String(r.id), before = lastStatus.get(id);
    if (before !== undefined && before !== "scored" && r.status === "scored") newUntil.set(id, now + NEW_MS);
    lastStatus.set(id, r.status);
  }
  // Rows arrive ranked (scored, running, queued, failed); failed runs are not on this board.
  const rows = all.filter(r => r.status !== "failed").slice(0, MAX_ROWS);
  if (!rows.length) {
    list.innerHTML = '<li class="empty">Scan to submit the first strategy</li>';
  } else {
    if (list.querySelector(".empty")) list.innerHTML = "";
    reconcile(list, rows.map(r => ({ ...r, id: String(r.id) })), () => {
      const li = document.createElement("li");
      li.innerHTML = '<span class="rk"></span><span class="sc num"></span><span class="nm"></span><span class="rt num"></span>';
      return li;
    }, (li, r) => {
      const scored = r.status === "scored";
      const fresh = (newUntil.get(r.id) || 0) > now;
      li.className = `ar-row st-${scored ? "scored" : r.status === "running" ? "running" : "queued"}` + (fresh ? " new" : "");
      li.style.setProperty("--c", scored && r.rank ? COLORS[Math.min(r.rank - 1, 3)] : "");
      li.querySelector(".rk").textContent = scored && r.rank ? ordinal(r.rank) : "";
      const sc = li.querySelector(".sc");
      // Running rows may carry a provisional return (marked value so far); queued rows never do.
      const live = r.status === "running" && r.provisional === true;
      sc.className = "sc num" + (live ? " prov" : "");
      if ((scored || live) && typeof r.return_pct === "number") countTo(sc, start * (1 + r.return_pct / 100), money);
      else { sc._v = undefined; sc.textContent = ""; }
      setName(li.querySelector(".nm"), r.name, safeUrl(r.logfire_url));
      li.querySelector(".rt").textContent = scored
        ? (typeof r.return_pct === "number" ? pct(r.return_pct) : "")
        : r.status === "running" ? `DAY ${Number(r.day) || 0}/${DAYS}` : "READY";
    });
  }

  const latest = Array.isArray(data.events) && data.events[0];
  const text = latest ? String(latest.text).replace(/\u2212/g, "-").toUpperCase() : "";
  if (text !== target) { target = text; typed = ""; type(); }
}

async function poll() {
  try {
    const res = await fetch("/api/board", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    conn.hidden = true;
  } catch (_) {
    conn.hidden = false;
  } finally {
    setTimeout(poll, POLL_MS);
  }
}
poll();
})();
</script>
</body>
