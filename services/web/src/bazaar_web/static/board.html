@font-face { font-family: "Dwight"; src: url("/fonts/DwightMedium.woff2") format("woff2"); font-weight: 500; font-display: swap; }

/* Brand tokens (pydantic/brand). */
:root {
  color-scheme: dark;
  --sugar: #FBFFEA; --darkpurple: #36182D; --blackbean: #061314;
  --pyai-magenta: #E320E7; --pyai-cyan: #00FFEB; --pyai-yellow: #D0FF71; --calcium: #FF6550;
  --muted: #b48fa8;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --pixel: "Press Start 2P", "IBM Plex Mono", ui-monospace, monospace;
  --u: min(1vw, 1.7778vh);
}
html, body { height: 100%; }
body { margin: 0; background: var(--darkpurple); font-family: var(--sans); }
*, *::before, *::after { box-sizing: border-box; }
.num { font-variant-numeric: tabular-nums; }
.qr svg { display: block; width: 100%; height: auto; }
.qr .qr-fallback { font: 500 12px/1.4 var(--mono); word-break: break-all; padding: 8px; color: var(--darkpurple); }
.logo svg { display: block; width: 100%; height: auto; }
@keyframes blink { 50% { opacity: 0; } }

  background: radial-gradient(60% 70% at 50% 18%, rgba(229,32,233,.30) 0%, rgba(229,32,233,0) 60%), radial-gradient(50% 60% at 90% 100%, rgba(255,101,80,.16) 0%, rgba(255,101,80,0) 60%), #36182D;

.dash::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 2px, rgba(0,0,0,0) 2px 4px); mix-blend-mode: multiply; z-index: 4; }
.hd { grid-column: 1 / -1; display: flex; align-items: center; gap: calc(var(--u)*2); }
.hd .logo { width: calc(var(--u)*16); --logo-text: var(--sugar); --logo-mark: var(--pyai-magenta); filter: drop-shadow(0 0 calc(var(--u)*1) rgba(227,32,231,.45)); }
.hd h1 { margin: 0; font: 400 calc(var(--u)*1.9)/1.2 var(--pixel); color: var(--pyai-yellow); text-shadow: calc(var(--u)*.22) calc(var(--u)*.22) 0 var(--pyai-magenta); letter-spacing: .03em; }
.hd .sub { margin-left: auto; font: 400 calc(var(--u)*.7)/1.6 var(--pixel); color: var(--pyai-cyan); text-align: right; }

/* Left: the Arcade leaderboard. */
.board { min-height: 0; display: flex; flex-direction: column; }
.ar-title { font: 400 calc(var(--u)*1.2)/1.2 var(--pixel); margin: 0 0 calc(var(--u)*.9); color: var(--pyai-yellow); }
.ar-cols, .ar-row { display: grid; grid-template-columns: calc(var(--u)*4.2) calc(var(--u)*8.6) minmax(0,1fr) calc(var(--u)*7.6); gap: calc(var(--u)*.9); align-items: center; }
.ar-cols { font: 400 calc(var(--u)*.62)/1 var(--pixel); color: var(--muted); padding: 0 calc(var(--u)*.6) calc(var(--u)*.7); }
.ar-cols span:nth-child(4) { text-align: right; }
.ar-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.ar-row { padding: calc(var(--u)*.55) calc(var(--u)*.6); font: 400 calc(var(--u)*.95)/1.2 var(--pixel); color: var(--c, var(--sugar)); border-radius: calc(var(--u)*.3); }
.ar-row.hl { background: rgba(251,255,234,.08); }
.ar-row .nm { font: 700 calc(var(--u)*1.05)/1.2 var(--mono); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-row .nm a { color: inherit; text-decoration: none; cursor: pointer; }
.ar-row .rt { text-align: right; font-size: calc(var(--u)*.8); white-space: nowrap; }
.ar-row.st-running, .ar-row.st-queued { --c: #d9c4d3; }
.ar-row.st-running .rt { color: var(--pyai-cyan); animation: blink 1s steps(1) infinite; }
.ar-row.st-queued .rt { color: var(--muted); }
.ar-row .sc.prov { opacity: .7; }
.ar-row.new .nm::after { content: "NEW"; margin-left: .8em; font: 400 calc(var(--u)*.6)/1 var(--pixel); color: var(--blackbean); background: var(--pyai-yellow); padding: .3em .5em; animation: blink .5s steps(1) 16; }
.empty { font: 400 calc(var(--u)*1)/1.6 var(--pixel); color: var(--pyai-yellow); text-transform: uppercase; padding: calc(var(--u)*2) calc(var(--u)*.6); }

/* Center: the chart. */
.chart { min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.6); }
.chart h2 { margin: 0; font: 400 calc(var(--u)*.85)/1.2 var(--pixel); color: var(--pyai-cyan); }
.plot { position: relative; flex: 1; min-height: 0; }
.plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plot .grid line { stroke: rgba(251,255,234,.10); stroke-width: 1; }
.plot .axis text { fill: var(--muted); font: 500 calc(var(--u)*.72) var(--mono); }
.plot .ref line { stroke: var(--sugar); stroke-opacity: .55; stroke-dasharray: 6 6; stroke-width: 1.5; }
.plot .ref text { fill: var(--sugar); fill-opacity: .7; font: 500 calc(var(--u)*.7) var(--mono); }
.plot .series polyline { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; transition: opacity .2s; }
.plot .series.baseline polyline { stroke-width: 2; stroke-dasharray: 7 6; }
.plot .series circle { stroke: none; }
.plot .series.running circle.tip { animation: blink 1s steps(1) infinite; }
.plot.focus .series { opacity: .18; }
.plot.focus .series.on { opacity: 1; }
.plot.focus .series.on polyline { stroke-width: 4; }
.plot .cursor { stroke: var(--sugar); stroke-opacity: .35; stroke-width: 1; }
.tip-box { position: absolute; pointer-events: none; z-index: 3; background: rgba(6,19,20,.92); border: 1px solid var(--pyai-cyan); padding: calc(var(--u)*.45) calc(var(--u)*.7); font: 500 calc(var(--u)*.8)/1.4 var(--mono); white-space: nowrap; }
.tip-box[hidden] { display: none; }
.tip-box b { display: block; color: var(--pyai-yellow); font-weight: 700; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: calc(var(--u)*.3) calc(var(--u)*1.2); font: 500 calc(var(--u)*.75)/1.4 var(--mono); }
.legend li { display: flex; align-items: center; gap: .45em; cursor: pointer; max-width: calc(var(--u)*16); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
.legend li.on { opacity: 1; text-decoration: underline; }
.legend i { flex: 0 0 auto; width: 1.4em; height: .3em; border-radius: 2px; background: var(--c); }
.legend li.baseline i { background: repeating-linear-gradient(90deg, var(--c) 0 .35em, transparent .35em .6em); }

/* Right: insert coin, then the market wire. */
.side { min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u)*1); }
.ar-coin { font: 400 calc(var(--u)*.95)/1.5 var(--pixel); color: var(--pyai-yellow); text-align: center; animation: blink 1.1s steps(1) infinite; }
.ar-qr { background: var(--sugar); padding: calc(var(--u)*.9); border: calc(var(--u)*.35) solid var(--pyai-cyan); box-shadow: 0 0 0 calc(var(--u)*.35) var(--darkpurple), 0 0 0 calc(var(--u)*.7) var(--pyai-magenta); width: calc(var(--u)*15); align-self: center; }
.side p { font: 400 calc(var(--u)*.62)/1.8 var(--pixel); color: #e6cfe0; margin: 0; text-align: center; }
.side .url { font: 500 calc(var(--u)*.7)/1.3 var(--mono); color: #c9a9bf; word-break: break-all; }
.wire { min-height: 0; flex: 1; display: flex; flex-direction: column; border-top: 2px solid rgba(251,255,234,.18); padding-top: calc(var(--u)*.8); }
.wire h3 { margin: 0 0 calc(var(--u)*.6); font: 400 calc(var(--u)*.7)/1 var(--pixel); color: var(--pyai-cyan); }
.wire ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.45); overflow: hidden; }
.wire li { font: 400 calc(var(--u)*.78)/1.35 var(--sans); color: #e6cfe0; display: grid; grid-template-columns: calc(var(--u)*4.2) 1fr; gap: .5em; }
.wire li time { font: 400 calc(var(--u)*.68)/1.7 var(--mono); color: var(--muted); }

.tape { grid-column: 1 / -1; margin: 0 calc(var(--u)*-2); display: flex; align-items: center; border-top: 2px solid rgba(251,255,234,.18); background: rgba(6,19,20,.55); overflow: hidden; white-space: nowrap; }
.tape[hidden] { display: none; }
.tape .label { flex: 0 0 auto; padding: calc(var(--u)*.75) calc(var(--u)*1.2); font: 400 calc(var(--u)*.62)/1.3 var(--pixel); color: var(--blackbean); background: var(--pyai-yellow); z-index: 1; }
.tape .viewport { flex: 1; overflow: hidden; }
.tape .track { display: inline-flex; gap: calc(var(--u)*2.4); padding: calc(var(--u)*.75) calc(var(--u)*1.2); font: 500 calc(var(--u)*.95)/1 var(--mono); animation: tape 30s linear infinite; }

.tape .track span em { font-style: normal; margin-left: .55em; }
.up { color: var(--pyai-cyan); } .down { color: var(--calcium); } .flat { color: var(--muted); }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.conn { position: fixed; top: calc(var(--u)*.6); right: calc(var(--u)*1); z-index: 5; font: 400 calc(var(--u)*.6)/1 var(--pixel); color: var(--calcium); }
.conn[hidden] { display: none; }

@media (max-width: 760px) {
  :root { --u: 6px; }
  .dash { position: relative; min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding: 16px 14px 0; overflow-x: hidden; }
  .hd { flex-wrap: wrap; }
  .hd .sub { margin-left: 0; text-align: left; }
  .ar-cols, .ar-row { grid-template-columns: 34px 78px minmax(0,1fr); }
  .ar-cols span:nth-child(4), .ar-row .rt { display: none; }
  .plot { height: 300px; flex: none; }
  .legend li { max-width: 46vw; }
  .wire { max-height: 260px; }
  .tape { margin: 0 -14px; }
}
@media (prefers-reduced-motion: reduce) {
  .ar-coin, .ar-row.new .nm::after, .ar-row.st-running .rt, .plot .series.running circle.tip { animation: none; }
  .tape .track { animation: none; flex-wrap: wrap; white-space: normal; }
  .plot .series polyline { transition: none; }
}
</style>

}

/* ---------- animation helpers ---------- */
function reconcile(list, items, make, update) {
  const old = new Map();
  for (const el of list.children) if (el.dataset.k) old.set(el.dataset.k, el);
  const first = new Map();
  if (!RM) old.forEach((el, k) => first.set(k, el.getBoundingClientRect()));
  const keep = new Set();
  items.forEach((it, i) => {
    let el = old.get(it.id);
    if (!el) { el = make(it); el.dataset.k = it.id; el._new = true; }
    update(el, it, i);
    const at = list.children[i];
    if (at !== el) list.insertBefore(el, at || null);
    keep.add(it.id);
  });
  for (const el of [...list.children]) if (!el.dataset.k || !keep.has(el.dataset.k)) el.remove();
  for (const el of list.children) {
    if (el._new) { el._new = false; if (!RM && list.offsetParent) el.animate([{ opacity: 0, transform: "translateY(24px) scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 750, easing: EASE }); continue; }
    if (RM) continue;
    const f = first.get(el.dataset.k); if (!f) continue;
    const l = el.getBoundingClientRect();
    const dx = f.left - l.left, dy = f.top - l.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 850, easing: EASE });
  }
}
function countTo(el, to, fmt) {
  const from = el._v ?? to; el._v = to;
  if (RM || from === to || !el.offsetParent) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  cancelAnimationFrame(el._raf);
  const step = (t) => { const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

/* ---------- QR ---------- */
function qrSVG(url, fg, mark) {
  if (typeof qrcode !== "function") return `<div class="qr-fallback">${esc(url)}</div>`;
  const q = qrcode(0, "H"); q.addData(url); q.make();
  const n = q.getModuleCount(), pad = 2, size = n + pad * 2;
  const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  const hole = Math.ceil(n * 0.24) | 1, h0 = (n - hole) / 2;
  const inHole = (r, c) => r >= h0 && r < h0 + hole && c >= h0 && c < h0 + hole;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c) && !finder(r, c) && !inHole(r, c)) d += `M${c + pad + .08} ${r + pad + .08}h.84v.84h-.84z`;
  const eye = (r, c) => `<rect x="${c + pad + .5}" y="${r + pad + .5}" width="6" height="6" rx="1.6" fill="none" stroke="${fg}" stroke-width="1"/><rect x="${c + pad + 2}" y="${r + pad + 2}" width="3" height="3" rx=".8" fill="${fg}"/>`;
  const m = hole - 1.2, mx = h0 + pad + .6, my = h0 + pad + .6;
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code for ${esc(url)}"><rect width="${size}" height="${size}" fill="none"/><path d="${d}" fill="${fg}"/>${eye(0, 0)}${eye(0, n - 7)}${eye(n - 7, 0)}<svg x="${mx}" y="${my}" width="${m}" height="${m}" viewBox="0 0 139 121"><path fill="${mark}" d="${MARK_D}"/></svg></svg>`;
}


/* ---------- page ---------- */
const $ = (id) => document.getElementById(id);
const list = $("list"), conn = $("conn"), plot = $("plot"), svg = $("svg"), tip = $("tip");
const legend = $("legend"), wire = $("wire");
$("logo").innerHTML = LOGO_SVG;
$("qr").innerHTML = qrSVG(SUBMIT_URL, "#36182D", "#E320E7");
$("url").textContent = SUBMIT_URL.replace(/^https?:\/\//, "");

const lastStatus = new Map(), newUntil = new Map();
let lastData = null, focusId = null, pinnedId = null;

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, String(v));
  if (parent) parent.appendChild(el);
  return el;
}

/* ---------- leaderboard (left) ---------- */
function renderBoard(data) {
  const start = data.window && typeof data.window.starting_cash === "number" ? data.window.starting_cash : 10000;
  const all = Array.isArray(data.rows) ? data.rows : [];
  const now = Date.now();
  for (const r of all) {
    const id = String(r.id), before = lastStatus.get(id);
    if (before !== undefined && before !== "scored" && r.status === "scored") newUntil.set(id, now + NEW_MS);
    lastStatus.set(id, r.status);
  }
  // Rows arrive ranked (scored, running, queued, failed); failed runs are not on this board.
  const rows = all.filter(r => r.status !== "failed").slice(0, MAX_ROWS);
  if (!rows.length) {
    list.innerHTML = '<li class="empty">Scan to submit the first strategy</li>';
    return;
  }
  if (list.querySelector(".empty")) list.innerHTML = "";
  reconcile(list, rows.map(r => ({ ...r, id: String(r.id) })), () => {
    const li = document.createElement("li");
    li.innerHTML = '<span class="rk"></span><span class="sc num"></span><span class="nm"></span><span class="rt num"></span>';
    li.addEventListener("mouseenter", () => setFocus(li.dataset.k));
    li.addEventListener("mouseleave", () => setFocus(null));
    return li;
  }, (li, r) => {
    const scored = r.status === "scored";
    const fresh = (newUntil.get(r.id) || 0) > now;
    const live = r.status === "running" && r.provisional === true;
    li.className = `ar-row st-${scored ? "scored" : r.status === "running" ? "running" : "queued"}` + (fresh ? " new" : "") + (r.id === (pinnedId || focusId) ? " hl" : "");
    li.style.setProperty("--c", scored && r.rank ? COLORS[Math.min(r.rank - 1, 3)] : "");
    li.querySelector(".rk").textContent = scored && r.rank ? ordinal(r.rank) : "";
    const sc = li.querySelector(".sc");
    sc.className = "sc num" + (live ? " prov" : "");
    if ((scored || live) && typeof r.return_pct === "number") countTo(sc, start * (1 + r.return_pct / 100), money);
    else { sc._v = undefined; sc.textContent = ""; }
    setName(li.querySelector(".nm"), r.name, safeUrl(r.logfire_url));
    li.querySelector(".rt").textContent = scored
      ? (typeof r.return_pct === "number" ? pct(r.return_pct) : "")
      : r.status === "running" ? `DAY ${Number(r.day) || 0}/${DAYS}` : "READY";
  });
}

/* ---------- chart (center) ---------- */
function chartSeries(rows) {
  // Top 10 scored by rank, every baseline, and running submissions with values so far.
  const valid = (h) => Array.isArray(h) && h.some(p => p && Number.isFinite(p.day) && Number.isFinite(p.value));
  const picked = [], seen = new Set();
  const add = (r) => { const id = String(r.id); if (!seen.has(id) && valid(r.history)) { seen.add(id); picked.push(r); } };
  rows.filter(r => r.status === "scored").slice(0, 10).forEach(add);
  rows.filter(r => r.kind === "baseline" && r.status === "scored").forEach(add);
  rows.filter(r => r.status === "running").forEach(add);
  let rank = 0, base = 0;
  return picked.map(r => {
    const baseline = r.kind === "baseline";
    const color = baseline ? BASELINE_COLORS[base++ % BASELINE_COLORS.length] : PALETTE[rank++ % PALETTE.length];
    const pts = r.history.filter(p => p && Number.isFinite(p.day) && Number.isFinite(p.value)).map(p => ({ day: p.day, value: p.value }));
    return { id: String(r.id), name: String(r.name), color, baseline, running: r.status === "running", pts };
  });
}

let geom = null;

function renderChart(data) {
  const start = data.window && typeof data.window.starting_cash === "number" ? data.window.starting_cash : 10000;
  const series = chartSeries(Array.isArray(data.rows) ? data.rows : []);
  const W = Math.max(plot.clientWidth, 200), H = Math.max(plot.clientHeight, 140);
  const pad = { l: Math.max(Math.round(W * 0.085), 58), r: 14, t: 10, b: 28 };
  const values = [start, ...series.flatMap(s => s.pts.map(p => p.value))];
  let lo = Math.min(...values), hi = Math.max(...values);
  const span = Math.max(hi - lo, start * 0.004);
  lo -= span * 0.12; hi += span * 0.12;
  const x = (day) => pad.l + ((day - 1) / (DAYS - 1)) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
  geom = { x, y, series, pad, W, H };

  svg.replaceChildren();
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const grid = svgEl("g", { class: "grid" }, svg), axis = svgEl("g", { class: "axis" }, svg);
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4, yy = y(v);
    svgEl("line", { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy }, grid);
    const t = svgEl("text", { x: pad.l - 8, y: yy + 4, "text-anchor": "end" }, axis);
    t.textContent = money(v);
  }
  for (let d = 1; d <= DAYS; d++) {
    const t = svgEl("text", { x: x(d), y: H - 8, "text-anchor": "middle" }, axis);
    t.textContent = "D" + d;
  }
  const ref = svgEl("g", { class: "ref" }, svg);
  svgEl("line", { x1: pad.l, x2: W - pad.r, y1: y(start), y2: y(start) }, ref);
  const rt = svgEl("text", { x: W - pad.r, y: y(start) - 6, "text-anchor": "end" }, ref);
  rt.textContent = money(start) + " START";

  for (const s of series) {
    const g = svgEl("g", { class: "series" + (s.baseline ? " baseline" : "") + (s.running ? " running" : "") }, svg);
    g.dataset.id = s.id;
    const path = s.pts.map(p => `${x(p.day).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
    svgEl("polyline", { points: path, stroke: s.color }, g);
    const last = s.pts[s.pts.length - 1];
    svgEl("circle", { class: "tip", cx: x(last.day), cy: y(last.value), r: s.running ? 5 : 3.5, fill: s.color }, g);
  }
  svgEl("line", { class: "cursor", x1: -10, x2: -10, y1: pad.t, y2: H - pad.b, id: "cursor" }, svg);

  // Legend, rebuilt each poll: data via textContent and dataset only.
  legend.replaceChildren(...series.map(s => {
    const li = document.createElement("li");
    li.dataset.id = s.id;
    if (s.baseline) li.classList.add("baseline");
    li.style.setProperty("--c", s.color);
    li.appendChild(document.createElement("i"));
    li.appendChild(document.createTextNode(s.name));
    li.title = s.name;
    li.addEventListener("mouseenter", () => setFocus(s.id));
    li.addEventListener("mouseleave", () => setFocus(null));
    li.addEventListener("click", () => { pinnedId = pinnedId === s.id ? null : s.id; applyFocus(); });
    return li;
  }));
  applyFocus();
}

function setFocus(id) { focusId = id; applyFocus(); }

function applyFocus() {
  const id = pinnedId || focusId;
  plot.classList.toggle("focus", Boolean(id));
  for (const g of svg.querySelectorAll(".series")) g.classList.toggle("on", g.dataset.id === id);
  for (const li of legend.children) li.classList.toggle("on", li.dataset.id === id);
  for (const li of list.children) if (li.dataset.k) li.classList.toggle("hl", li.dataset.k === id);
}

function showTip(event) {
  if (!geom || !geom.series.length) return;
  const box = svg.getBoundingClientRect();
  const px = ((event.clientX - box.left) / box.width) * geom.W, py = ((event.clientY - box.top) / box.height) * geom.H;
  const day = Math.min(DAYS, Math.max(1, Math.round(1 + ((px - geom.pad.l) / (geom.W - geom.pad.l - geom.pad.r)) * (DAYS - 1))));
  let best = null;
  for (const s of geom.series) {
    const p = s.pts.find(q => q.day === day);
    if (!p) continue;
    const d = Math.abs(geom.y(p.value) - py);
    if (!best || d < best.d) best = { s, p, d };
  }
  const cursor = document.getElementById("cursor");
  if (!best) { tip.hidden = true; return; }
  cursor.setAttribute("x1", geom.x(day)); cursor.setAttribute("x2", geom.x(day));
  focusId = best.s.id; applyFocus();
  tip.replaceChildren();
  const b = document.createElement("b");
  b.textContent = best.s.name;
  tip.appendChild(b);
  tip.appendChild(document.createTextNode(`DAY ${day} · ${money(best.p.value)}`));
  tip.hidden = false;
  const left = Math.min((geom.x(day) / geom.W) * box.width + 14, box.width - tip.offsetWidth - 4);
  tip.style.left = `${Math.max(0, left)}px`;
  tip.style.top = `${Math.max(0, (geom.y(best.p.value) / geom.H) * box.height - tip.offsetHeight - 10)}px`;
}
plot.addEventListener("mousemove", showTip);
plot.addEventListener("mouseleave", () => { tip.hidden = true; const c = document.getElementById("cursor"); if (c) { c.setAttribute("x1", -10); c.setAttribute("x2", -10); } setFocus(null); });
addEventListener("resize", () => { if (lastData) renderChart(lastData); });

/* ---------- market wire (right) ---------- */
function renderWire(data) {
  const events = Array.isArray(data.events) ? data.events : [];
  wire.replaceChildren(...events.slice(0, 12).map(ev => {
    const li = document.createElement("li");
    const time = document.createElement("time"), text = document.createElement("span");
    const d = new Date(ev.t);
    time.textContent = isNaN(d) ? "" : d.toTimeString().slice(0, 5);
    text.textContent = String(ev.text);
    li.append(time, text);
    return li;
  }));
}

/* ---------- 12-stock replay tape (bottom) ---------- */
const tape = $("tape"), track = $("track"), tapeLabel = $("tape-label");
let tapeDays = [], tapeIndex = 0;
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

function renderTape() {
  if (!tapeDays.length) { tape.hidden = true; return; }
  const day = tapeDays[tapeIndex % tapeDays.length];
  const d = new Date(String(day.date) + "T12:00:00Z");
  tapeLabel.textContent = `REPLAY FEB 2-13 2026 · ${isNaN(d) ? "" : MONTHS[d.getUTCMonth()] + " " + d.getUTCDate()}`;
  const quote = (q) => {
    const span = document.createElement("span");
    const b = document.createElement("b"), close = document.createElement("span"), chg = document.createElement("em");
    b.textContent = String(q.symbol);
    close.textContent = Number.isFinite(q.close) ? q.close.toFixed(2) : "";
    const c = q.change_pct;
    chg.className = typeof c !== "number" ? "flat" : c > 0 ? "up" : c < 0 ? "down" : "flat";
    chg.textContent = typeof c === "number" ? pct(c) : "";
    span.append(b, close, chg);
    return span;
  };
  const quotes = Array.isArray(day.quotes) ? day.quotes : [];
  // Two copies so the CSS marquee loops seamlessly.
  track.replaceChildren(...quotes.map(quote), ...(RM ? [] : quotes.map(quote)));
  tape.hidden = false;
}

async function loadTickers() {
  try {
    const res = await fetch("/api/tickers", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    tapeDays = Array.isArray(data.days) ? data.days : [];
  } catch (_) { tapeDays = []; }
  renderTape();
  if (!tapeDays.length) setTimeout(loadTickers, 30000);
}
setInterval(() => { if (tapeDays.length) { tapeIndex++; renderTape(); } }, TAPE_MS);
loadTickers();

/* ---------- polling ---------- */
function render(data) {
  lastData = data;
  renderBoard(data);
  renderChart(data);
  renderWire(data);
}

async function poll() {
  try {
    const res = await fetch("/api/board", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    conn.hidden = true;
  } catch (_) {
    conn.hidden = false;
  } finally {
    setTimeout(poll, POLL_MS);
  }
}
poll();
})();
</script>
