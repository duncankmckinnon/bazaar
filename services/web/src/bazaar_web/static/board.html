<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Agent Factory Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<script src="/static/vendor/qrcode.min.js"></script>
<script type="module" src="/browser-telemetry.js?page=board"></script>
<style>
/* Brand tokens (pydantic/brand) and the v11 prototype's palette. */
:root {
  color-scheme: dark;
  --text: #efe6f2; --muted: #b7a6bd; --soft: #cdbfd2; --lime: #d0ff71; --aqua: #00ffeb; --magenta: #e520e9;
  --line: #4b3552; --edge: #9a86a2; --ink: #1c1220; --calcium: #FF6550;
  --sugar: #FBFFEA; --darkpurple: #36182D;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --pixel: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
  --u: min(1vw, 1.7778vh);
  /* The prototype is drawn at 1920x1080; --px is one of its pixels at the current size. */
  --px: calc(var(--u) / 19.2);
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); font-family: var(--sans); }
*, *::before, *::after { box-sizing: border-box; }
.num { font-variant-numeric: tabular-nums; }
.qr svg { display: block; width: 100%; height: auto; }
.qr .qr-fallback { font: 500 12px/1.4 var(--mono); word-break: break-all; padding: 8px; color: var(--darkpurple); }
@keyframes blink { 50% { opacity: 0; } }

/* The conference pane: header; the tabbed leaderboard beside the chart, with the QR strip under
   the chart; the replay tape along the bottom. */
.dash { position: fixed; inset: 0; overflow: hidden; color: var(--text);
  background: radial-gradient(90% 70% at 40% 10%, #5a1d5e 0%, #2a1230 55%, #1c1220 100%);
  display: grid; grid-template-columns: calc(var(--px)*900) minmax(0,1fr); grid-template-rows: auto minmax(0,1fr) calc(var(--px)*330) auto;
  grid-template-areas: "hd hd" "board chart" "board side" "tape tape";
  column-gap: calc(var(--px)*48); row-gap: calc(var(--px)*18); padding: calc(var(--px)*28) calc(var(--px)*40) 0; }
.hd { grid-area: hd; display: flex; align-items: center; justify-content: space-between; gap: calc(var(--px)*40); }
/* Brand guidelines 1.4: one logomark (1.154x the logo's height) between the logo and the title. */
.hd .brand { display: flex; align-items: center; gap: calc(var(--px)*60); min-width: 0; }
.hd .logo { display: block; height: calc(var(--px)*52); width: auto; flex: none; }
.hd h1 { margin: 0; white-space: nowrap; font: 400 calc(var(--px)*56)/1.1 var(--pixel); color: var(--lime); letter-spacing: .02em; }
.hd .sub { text-align: right; font: 400 calc(var(--px)*17)/1.4 var(--pixel); color: var(--aqua); white-space: nowrap; }
.hd .sub span { display: block; }
.hd .sub .factory { color: var(--lime); }

/* Left: the leaderboard, one tab at a time: its top 15, then everything pending. */
.board { grid-area: board; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--px)*12); }
.tabs { display: flex; gap: calc(var(--px)*10); }
.tab { min-height: max(44px, calc(var(--px)*48)); padding: 0 calc(var(--px)*18); font: 400 max(14px, calc(var(--px)*18))/1 var(--pixel); cursor: pointer; border-radius: 6px; background: transparent; color: var(--text); border: 1px solid var(--edge); }
.tab[aria-selected="true"] { background: var(--lime); color: var(--ink); border-color: var(--lime); }
.tab:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
.panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.ar-cols, .ar-row { display: grid; grid-template-columns: calc(var(--px)*80) calc(var(--px)*140) minmax(0,1fr) calc(var(--px)*110); column-gap: calc(var(--px)*12); align-items: center; }
.ar-cols { padding: calc(var(--px)*4) calc(var(--px)*8); font: 400 calc(var(--px)*14)/1 var(--pixel); color: var(--muted); }
.ar-cols span:nth-child(4) { text-align: right; }
.ar-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; flex: none; }
.ar-row { height: calc(var(--px)*40); padding: 0 calc(var(--px)*8); font: 400 calc(var(--px)*21)/1 var(--pixel); color: var(--c, var(--text)); border-radius: 4px; }
.ar-row.hl { background: rgba(239,230,242,.08); }
.ar-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.ar-row .nm a { color: inherit; text-decoration: none; cursor: pointer; }
/* House (AI-generated) strategies carry a dim tag; attendee rows have none. */
.ar-row .nm .ai { font: 400 calc(var(--px)*13)/1 var(--pixel); color: var(--muted); border: 1px solid currentColor; padding: 1px 6px; margin-right: calc(var(--px)*8); vertical-align: .15em; }
.ar-row .rt { text-align: right; white-space: nowrap; }
.ar-row .sc.prov { opacity: .7; }
.ar-row.new .nm::after { content: "NEW"; margin-left: .8em; font: 400 calc(var(--px)*13)/1 var(--pixel); color: var(--ink); background: var(--lime); padding: .3em .5em; animation: blink .5s steps(1) 16; }
.pending-head { margin: calc(var(--px)*6) 0 0; border-top: 1px solid var(--line); padding-top: calc(var(--px)*8); font: 400 calc(var(--px)*14)/1 var(--pixel); color: var(--aqua); }
.pending { position: relative; list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden; }
.pending-more { flex: none; margin: 0; padding: 0 calc(var(--px)*8); font: 400 calc(var(--px)*18)/calc(var(--px)*34) var(--pixel); color: var(--muted); }
.pending .ar-row[hidden] { display: none; }
.pending .ar-row { height: calc(var(--px)*34); font-size: calc(var(--px)*18); color: var(--muted); }
/* The day text stays steady (readable in photos); a dot before it blinks as the live cue. */
.pending .ar-row.st-running .rt { color: var(--aqua); }
.pending .ar-row.st-running .rt::before { content: ""; display: inline-block; width: .5em; height: .5em; margin-right: .5em; border-radius: 50%; background: var(--aqua); vertical-align: .1em; animation: blink 1s steps(1) infinite; }
/* The footnote under the table: static, and legible at phone width (never below 11px). */
.ar-note { flex: none; margin: 0; padding: 0 calc(var(--px)*8); font: 400 max(calc(var(--px)*13), 11px)/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.ar-note .ai { font: 400 .85em/1 var(--pixel); border: 1px solid currentColor; padding: .2em .35em; }
.empty { font: 400 calc(var(--px)*21)/1.6 var(--pixel); color: var(--lime); padding: calc(var(--px)*12) calc(var(--px)*8); }

/* Right: the chart, with the column's full height above the QR strip. */
.chart { grid-area: chart; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--px)*8); }
.chart h2 { margin: 0; font: 400 calc(var(--px)*20)/1.2 var(--pixel); color: var(--aqua); }
.plot { position: relative; flex: 1; min-height: 0; }
.plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plot .grid line { stroke: rgba(239,230,242,.10); stroke-width: 1; }
.plot .axis text { fill: var(--muted); font: 500 calc(var(--px)*14) var(--mono); }
.plot .ref line { stroke: var(--edge); stroke-dasharray: 6 6; stroke-width: 1.5; }
.plot .ref text { fill: var(--muted); font: 500 calc(var(--px)*14) var(--mono); }
.plot .series polyline { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; transition: opacity .2s; }
.plot .series.baseline polyline { stroke-width: 2; stroke-dasharray: 8 6; }
.plot .series circle { stroke: none; }
.plot .series.running circle.tip { animation: blink 1s steps(1) infinite; }
.plot.focus .series { opacity: .18; }
.plot.focus .series.on { opacity: 1; }
.plot.focus .series.on polyline { stroke-width: 4; }
.plot .cursor { stroke: var(--text); stroke-opacity: .35; stroke-width: 1; }
.tip-box { position: absolute; pointer-events: none; z-index: 3; background: rgba(28,18,32,.94); border: 1px solid var(--aqua); padding: calc(var(--px)*8) calc(var(--px)*12); font: 500 calc(var(--px)*15)/1.4 var(--mono); white-space: nowrap; }
.tip-box[hidden] { display: none; }
.tip-box b { display: block; color: var(--lime); font-weight: 700; }

/* Under the chart: the QR strip. The QR keeps a 4-module quiet zone (qrSVG) on the light card,
   and error correction H for the logo in its centre. */
.side { grid-area: side; min-height: 0; display: flex; align-items: center; justify-content: flex-end; gap: calc(var(--px)*36); }
.side .ins { display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--px)*10); text-align: right; }
.ar-coin { font: 400 calc(var(--px)*48)/1.1 var(--pixel); color: var(--lime); }
.side p { font: 400 calc(var(--px)*26)/1.3 var(--pixel); color: var(--text); margin: 0; }
.side .url { font: 500 calc(var(--px)*20)/1.3 var(--mono); color: var(--soft); word-break: break-all; }
.ar-qr { background: var(--sugar); border: calc(var(--px)*8) solid var(--aqua); box-shadow: 0 0 0 calc(var(--px)*6) var(--ink), 0 0 0 calc(var(--px)*12) var(--magenta); width: calc(var(--px)*300); flex: 0 0 auto; }

/* Bottom: the replay tape of each day's top movers. */
.tape { grid-area: tape; margin: 0 calc(var(--px)*-40); display: flex; align-items: center; border-top: 1px solid var(--line); background: rgba(28,18,32,.7); overflow: hidden; white-space: nowrap; }
.tape[hidden] { display: none; }
.tape .label { flex: 0 0 auto; padding: calc(var(--px)*12) calc(var(--px)*20); font: 400 calc(var(--px)*14)/1.3 var(--pixel); color: var(--ink); background: var(--lime); z-index: 1; }
.tape .viewport { flex: 1; overflow: hidden; }
.tape .track { display: inline-flex; gap: calc(var(--px)*44); padding: calc(var(--px)*12) calc(var(--px)*20); font: 500 calc(var(--px)*18)/1 var(--mono); animation: tape 30s linear infinite; }
.tape .track span b { color: var(--text); margin-right: .55em; font-weight: 700; }
.tape .track span em { font-style: normal; margin-left: .55em; }
.up { color: var(--aqua); } .down { color: var(--calcium); } .flat { color: var(--muted); }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.conn { position: fixed; top: calc(var(--px)*10); right: calc(var(--px)*20); z-index: 5; font: 400 calc(var(--px)*14)/1 var(--pixel); color: var(--calcium); }
.conn[hidden] { display: none; }
/* F3: the admin-only factory control (built by the script below; never on the public view). */
.adm { position: fixed; left: calc(var(--px)*20); bottom: calc(var(--px)*20); z-index: 6; display: flex; gap: .7em; align-items: center; margin: 0; font: 400 max(calc(var(--px)*13), 10px)/1 var(--pixel); color: var(--muted); background: rgba(0,0,0,.6); border: 1px solid currentColor; border-radius: 999px; padding: .55em .9em; }
.adm input { font: 400 12px/1 var(--mono); width: 13em; color: var(--text); background: transparent; border: 1px solid currentColor; border-radius: 3px; padding: .35em .5em; }
.adm button { font: inherit; color: var(--ink); background: var(--lime); border: 0; border-radius: 3px; padding: .45em .7em; cursor: pointer; }
.adm button:disabled { opacity: .5; cursor: default; }
.adm .adm-lock { color: inherit; }
.adm .adm-note { color: var(--calcium); }

@media (max-width: 760px) {
  :root { --px: .62px; }
  .dash { position: relative; min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding: 16px 14px 0; overflow-x: hidden; }
  .hd { flex-wrap: wrap; }
  .hd .brand { flex-wrap: wrap; gap: 16px; }
  .hd h1 { white-space: normal; }
  .hd .sub { text-align: left; white-space: normal; }
  .tabs { flex-wrap: wrap; }
  .ar-cols, .ar-row { grid-template-columns: 42px 80px minmax(0,1fr) 70px; }
  .ar-row { height: 34px; }
  .plot { height: 300px; flex: none; }
  .side { justify-content: center; }
  .ar-qr { width: 200px; }
  .tape { margin: 0 -14px; }
}
@media (prefers-reduced-motion: reduce) {
  .ar-row.new .nm::after, .pending .ar-row.st-running .rt::before, .plot .series.running circle.tip { animation: none; }
  .tape .track { animation: none; flex-wrap: wrap; white-space: normal; }
  .plot .series polyline { transition: none; }
}
</style>
</head>
<body>
<main class="dash">
  <header class="hd">
    <div class="brand">
      <img class="logo" src="/static/brand/pydantic-name-dark.svg" alt="Pydantic" width="605" height="120" decoding="async">
      <h1>Trading agent factory</h1>
    </div>
    <div class="sub"><span id="sub-a"></span><span id="sub-b"></span><span id="sub-c" class="factory"></span></div>
  </header>
  <section class="board" aria-label="Leaderboard">
    <div class="tabs" role="tablist" aria-label="Leaderboard">
      <button type="button" class="tab" role="tab" id="tab-human" data-tab="human" aria-controls="panel" aria-selected="false" tabindex="-1">Human</button>
      <button type="button" class="tab" role="tab" id="tab-factory" data-tab="factory" aria-controls="panel" aria-selected="false" tabindex="-1">Agent factory</button>
      <button type="button" class="tab" role="tab" id="tab-both" data-tab="both" aria-controls="panel" aria-selected="true">Both</button>
    </div>
    <div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-both">
      <div class="ar-cols"><span>Rank</span><span>Score</span><span>Policy</span><span>Return</span></div>
      <ol class="ar-list" id="list"><li class="empty" id="connecting">CONNECTING...</li></ol>
      <p class="pending-head" id="pending-head">Pending · 0</p>
      <ol class="pending" id="pending" aria-labelledby="pending-head"></ol>
      <p class="pending-more" id="pending-more" hidden></p>
    </div>
    <p class="ar-note"><span class="ai">AI</span> = house strategy · <span class="ai">Gn</span> = bred from this window's results (in-sample)</p>
  </section>
  <section class="chart" aria-label="Portfolio value by trading day">
    <h2>Portfolio value by trading day</h2>
    <div class="plot" id="plot"><svg id="svg" role="img" aria-label="Portfolio value by trading day"></svg><div class="tip-box" id="tip" hidden></div></div>
  </section>
  <aside class="side">
    <div class="ins">
      <div class="ar-coin">Insert policy</div>
      <p>Scan to play<br>Start with $10,000</p>
      <p class="url" id="url"></p>
    </div>
    <div class="ar-qr"><div class="qr" id="qr"></div></div>
  </aside>
  <footer class="tape" id="tape" hidden><span class="label" id="tape-label">Replay</span><div class="viewport"><div class="track" id="track"></div></div></footer>
</main>
<div class="conn" id="conn" hidden>RECONNECTING</div>
<script>
(() => {
"use strict";
const SUBMIT_URL = __SUBMIT_URL__;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2,.8,.2,1)";
const DAYS = 10;
const NEW_MS = 8000;
const POLL_MS = 2000;
const TAPE_MS = 6000;
// The tab's 1st, 2nd and 3rd; the rest in the page's text colour.
const COLORS = ["#d0ff71", "#00ffeb", "#e520e9"];
// Chart lines by rank; baselines are drawn dashed in a muted tone. The brand colours come first;
// the rest were picked so that no two of the 12 are near-identical (CIE76 distance >= 30), with
// room for running rows after the 10 lines.
const PALETTE = ["#D0FF71", "#00FFEB", "#E320E7", "#FF6550", "#3E8BFF", "#FF9BD2", "#FBFFEA", "#FFC857", "#5BC0EB", "#6BFF3D", "#C77DFF", "#FF4DA6"];
const BASELINE_COLORS = ["#b48fa8", "#8fa8b4", "#a8b48f", "#c9a9bf"];
const SVG_NS = "http://www.w3.org/2000/svg";

/* ---------- the logomark, for the QR's centre (pydantic/brand pydantic-name-dark.svg) ---------- */
const MARK_D = "M137.385 90.65 73.515 2.075c-2.01-2.765-6.645-2.765-8.635 0L1.01 90.65a5.335 5.335 0 0 0 2.65 8.175l63.87 20.91h.01a5.303 5.303 0 0 0 3.3 0h.01l63.87-20.91a5.278 5.278 0 0 0 3.4-3.415 5.263 5.263 0 0 0-.75-4.76h.015ZM69.2 14.28l25.6 35.505-23.94-7.835c-.185-.06-.38-.05-.565-.095a3.502 3.502 0 0 0-.55-.09c-.185-.025-.36-.095-.545-.095-.185 0-.355.07-.54.095a4.245 4.245 0 0 0-.55.09c-.19.035-.385.035-.555.095L43.76 49.74l-.15.05 25.6-35.51h-.01ZM33.03 64.45l27.87-9.13 2.975-.97v52.99l-49.970-16.365L33.03 64.45Zm41.5 42.88V54.35l30.845 10.1L124.5 90.96l-49.975 16.37h.005Z";

/* ---------- formatting: the API sends percent units (0.6 means +0.60%) ---------- */
// ASCII "-" for negatives, as on the old pixel font.
const pct = (v) => (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toFixed(2) + "%";
const money = (v) => (v < 0 ? "-$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const safeUrl = (u) => typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
function setName(b, name, url) {
  // No link: plain text, exactly as before (this also drops a link the row used to have).
  if (!url) { b.textContent = name; return; }
  let a = b.firstElementChild;
  if (!a || a.tagName !== "A") {
    b.textContent = "";
    a = document.createElement("a");
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    b.appendChild(a);
  }
  a.setAttribute("href", url);
  a.textContent = name;
}

/* ---------- the trading window, from data; nothing is shown without one ---------- */
// "Feb 2–13 2026" within a month, "Sep 28 – Oct 9 2026" across months, null without dates.
function windowLabel(start, end) {
  const M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const parse = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s)); return m && +m[2] >= 1 && +m[2] <= 12 ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null; };
  const a = parse(start), b = parse(end);
  if (!a || !b) return null;
  if (a.y === b.y && a.m === b.m) return `${M[a.m]} ${a.d}–${b.d} ${a.y}`;
  if (a.y === b.y) return `${M[a.m]} ${a.d} – ${M[b.m]} ${b.d} ${a.y}`;
  return `${M[a.m]} ${a.d} ${a.y} – ${M[b.m]} ${b.d} ${b.y}`;
}

/* ---------- tabs: Human, Agent factory, Both, pinned by the URL hash ---------- */
// tabs:start
const TABS = ["human", "factory", "both"];
const TAB_ROWS = 15;
// "#human", "#factory" or "#both"; anything else is Both.
function tabFromHash(hash) {
  const id = String(hash || "").replace(/^#/, "");
  return TABS.indexOf(id) === -1 ? "both" : id;
}
// Both lists every row; Human and Agent factory list one lane each, never a baseline.
function onTab(row, tab) {
  if (tab === "both") return true;
  const lane = row.lane === "house" ? "factory" : row.lane === "human" ? "human" : null;
  return row.kind !== "baseline" && lane === tab;
}
// The tab's top TAB_ROWS scored by its own rank (overall on Both, within the lane otherwise),
// then every running and queued row of the tab, in the API's order.
function tabView(rows, tab) {
  const place = (r) => (tab === "both" ? r.rank : r.lane_rank);
  const top = (r) => Number.isInteger(place(r)) && place(r) >= 1 && place(r) <= TAB_ROWS;
  const scored = rows
    .filter((r) => r.status === "scored" && onTab(r, tab) && top(r))
    .sort((a, b) => place(a) - place(b))
    .map((r) => ({ ...r, place: place(r) }));
  const pending = rows.filter((r) => (r.status === "running" || r.status === "queued") && onTab(r, tab));
  return { scored, pending };
}
// The header's third line, from /api/board's public factory object.
function factoryText(f) {
  if (!f || typeof f !== "object") return "";
  if (f.state === "off") return "Factory: off";
  if (f.state === "paused") return "Factory: paused";
  if (f.state !== "running") return "";
  const n = Number.isInteger(f.running) && f.running >= 0 ? f.running : 0;
  return `Factory: ${n} ${n === 1 ? "agent" : "agents"} running`;
}
// tabs:end

/* ---------- animation helpers ---------- */
function reconcile(list, items, make, update) {
  const old = new Map();
  for (const el of list.children) if (el.dataset.k) old.set(el.dataset.k, el);
  const first = new Map();
  if (!RM) old.forEach((el, k) => first.set(k, el.getBoundingClientRect()));
  const keep = new Set();
  items.forEach((it, i) => {
    let el = old.get(it.id);
    if (!el) { el = make(it); el.dataset.k = it.id; el._new = true; }
    update(el, it, i);
    const at = list.children[i];
    if (at !== el) list.insertBefore(el, at || null);
    keep.add(it.id);
  });
  for (const el of [...list.children]) if (!el.dataset.k || !keep.has(el.dataset.k)) el.remove();
  for (const el of list.children) {
    if (el._new) { el._new = false; if (!RM && list.offsetParent) el.animate([{ opacity: 0, transform: "translateY(24px) scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 750, easing: EASE }); continue; }
    if (RM) continue;
    const f = first.get(el.dataset.k); if (!f) continue;
    const l = el.getBoundingClientRect();
    const dx = f.left - l.left, dy = f.top - l.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 850, easing: EASE });
  }
}
function countTo(el, to, fmt) {
  const from = el._v ?? to; el._v = to;
  if (RM || from === to || !el.offsetParent) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  cancelAnimationFrame(el._raf);
  const step = (t) => { const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

/* ---------- QR ---------- */
function qrSVG(url, fg, mark) {
  if (typeof qrcode !== "function") return `<div class="qr-fallback">${esc(url)}</div>`;
  const q = qrcode(0, "H"); q.addData(url); q.make();
  const n = q.getModuleCount(), pad = 4, size = n + pad * 2;  // a 4-module quiet zone
  const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  const hole = Math.ceil(n * 0.24) | 1, h0 = (n - hole) / 2;
  const inHole = (r, c) => r >= h0 && r < h0 + hole && c >= h0 && c < h0 + hole;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c) && !finder(r, c) && !inHole(r, c)) d += `M${c + pad + .08} ${r + pad + .08}h.84v.84h-.84z`;
  const eye = (r, c) => `<rect x="${c + pad + .5}" y="${r + pad + .5}" width="6" height="6" rx="1.6" fill="none" stroke="${fg}" stroke-width="1"/><rect x="${c + pad + 2}" y="${r + pad + 2}" width="3" height="3" rx=".8" fill="${fg}"/>`;
  const m = hole - 1.2, mx = h0 + pad + .6, my = h0 + pad + .6;
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code for ${esc(url)}"><rect width="${size}" height="${size}" fill="none"/><path d="${d}" fill="${fg}"/>${eye(0, 0)}${eye(0, n - 7)}${eye(n - 7, 0)}<svg x="${mx}" y="${my}" width="${m}" height="${m}" viewBox="0 0 139 121"><path fill="${mark}" d="${MARK_D}"/></svg></svg>`;
}


/* ---------- page ---------- */
const $ = (id) => document.getElementById(id);
const list = $("list"), pendingList = $("pending"), conn = $("conn"), plot = $("plot"), svg = $("svg"), tip = $("tip");
const tabButtons = [...document.querySelectorAll('[role="tab"]')];
$("qr").innerHTML = qrSVG(SUBMIT_URL, "#36182D", "#E320E7");
$("url").textContent = SUBMIT_URL.replace(/^https?:\/\//, "");

const lastStatus = new Map(), newUntil = new Map();
let lastData = null, focusId = null, pinnedId = null;
let tab = tabFromHash(location.hash);

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, String(v));
  if (parent) parent.appendChild(el);
  return el;
}

/* ---------- tabs ---------- */
function renderTabs() {
  for (const b of tabButtons) {
    const on = b.dataset.tab === tab;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  }
  $("panel").setAttribute("aria-labelledby", "tab-" + tab);
}
tabButtons.forEach((b, i) => {
  // The hash is the state, so the conference screen can be pinned to a tab.
  b.addEventListener("click", () => { location.hash = b.dataset.tab; });
  b.addEventListener("keydown", (event) => {
    const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
    if (!step) return;
    event.preventDefault();
    const next = tabButtons[(i + step + tabButtons.length) % tabButtons.length];
    next.focus();
    location.hash = next.dataset.tab;
  });
});
addEventListener("hashchange", () => {
  tab = tabFromHash(location.hash);
  renderTabs();
  if (lastData) render(lastData);
});

/* ---------- leaderboard (left) ---------- */
const EMPTY = {
  both: "Scan to submit the first strategy",
  human: "Scan to submit the first strategy",
  factory: "No factory strategies scored yet",
};

function makeRow() {
  const li = document.createElement("li");
  li.innerHTML = '<span class="rk"></span><span class="sc num"></span><span class="nm"></span><span class="rt num"></span>';
  li.addEventListener("mouseenter", () => setFocus(li.dataset.k));
  li.addEventListener("mouseleave", () => setFocus(null));
  return li;
}

function fillRow(li, r, start, now) {
  const scored = r.status === "scored";
  const fresh = (newUntil.get(r.id) || 0) > now;
  const live = r.status === "running" && r.provisional === true;
  li.className = `ar-row st-${scored ? "scored" : r.status === "running" ? "running" : "queued"}` + (fresh ? " new" : "") + (r.id === (pinnedId || focusId) ? " hl" : "");
  li.style.setProperty("--c", scored && r.place <= COLORS.length ? COLORS[r.place - 1] : "");
  li.querySelector(".rk").textContent = scored ? ordinal(r.place) : "···";
  const sc = li.querySelector(".sc");
  sc.className = "sc num" + (live ? " prov" : "");
  if ((scored || live) && typeof r.return_pct === "number") countTo(sc, start * (1 + r.return_pct / 100), money);
  else { sc._v = undefined; sc.textContent = scored ? "" : "—"; }
  const nm = li.querySelector(".nm");
  nm.querySelectorAll(".ai").forEach((chip) => chip.remove());  // first, so setName finds its link as before
  setName(nm, r.name, safeUrl(r.logfire_url));
  // Only server-made house rows carry handle "house" (attendees can't claim it). Once
  // perf/house-lane merges, the handle check can go in favour of lane alone.
  if (r.lane === "house" || r.handle === "house") {
    // Every house row gets "AI"; a factory strategy also gets its generation (G3) after it.
    const chips = ["AI"];
    const gen = Number(r.generation);
    if (Number.isInteger(gen) && gen > 0) chips.push(`G${gen}`);
    nm.prepend(...chips.map((text) => {
      const tag = document.createElement("i");
      tag.className = "ai";
      tag.textContent = text;
      return tag;
    }));
  }
  li.querySelector(".rt").textContent = scored
    ? (typeof r.return_pct === "number" ? pct(r.return_pct) : "")
    : r.status === "running" ? `day ${Number(r.day) || 0}/${DAYS}` : "queued";
}

function renderBoard(data) {
  const start = data.window && typeof data.window.starting_cash === "number" ? data.window.starting_cash : 10000;
  const all = Array.isArray(data.rows) ? data.rows : [];
  const now = Date.now();
  for (const r of all) {
    const id = String(r.id), before = lastStatus.get(id);
    if (before !== undefined && before !== "scored" && r.status === "scored") newUntil.set(id, now + NEW_MS);
    lastStatus.set(id, r.status);
  }
  const view = tabView(all, tab);
  $("pending-head").textContent = `Pending · ${view.pending.length}`;
  const keyed = (rows) => rows.map((r) => ({ ...r, id: String(r.id) }));
  reconcile(pendingList, keyed(view.pending), makeRow, (li, r) => fillRow(li, r, start, now));
  if (!view.scored.length) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = EMPTY[tab];
    list.replaceChildren(empty);
    return;
  }
  if (list.querySelector(".empty")) list.innerHTML = "";
  reconcile(list, keyed(view.scored), makeRow, (li, r) => fillRow(li, r, start, now));
}

// Pending rows that would run under the QR block are hidden and counted on a "+K more" line.
function fitPending() {
  const rows = [...pendingList.children], more = $("pending-more");
  for (const li of rows) li.hidden = false;
  more.hidden = true;
  // Layout offsets, not client rects or scrollHeight: a row's entry animation transforms it.
  const overflows = (li) => li.offsetTop + li.offsetHeight > pendingList.clientHeight;
  if (!rows.length || !overflows(rows[rows.length - 1])) return;
  more.hidden = false;
  let shown = rows.length;
  while (shown > 0 && overflows(rows[shown - 1])) rows[--shown].hidden = true;
  more.textContent = `+${rows.length - shown} more`;
}

/* ---------- chart (right) ---------- */
// chartSeries:start
// One line per distinct path on this tab (the server groups rows whose values agree within $1 a
// day and marks each group's best row in chart_tabs), every baseline (dashed, on every tab, as
// the reference lines), and this tab's running submissions.
function chartSeries(rows, tab) {
  const valid = (h) => Array.isArray(h) && h.some(p => p && Number.isFinite(p.day) && Number.isFinite(p.value));
  const members = (r) => (r.chart_tabs && typeof r.chart_tabs === "object" ? r.chart_tabs[tab] : undefined);
  const picked = [], seen = new Set();
  const add = (r) => { const id = String(r.id); if (!seen.has(id) && valid(r.history)) { seen.add(id); picked.push(r); } };
  rows.filter(r => r.status === "scored" && r.kind !== "baseline" && Number.isInteger(members(r))).forEach(add);
  rows.filter(r => r.kind === "baseline" && r.status === "scored").forEach(add);
  rows.filter(r => r.status === "running" && onTab(r, tab)).forEach(add);
  let rank = 0, base = 0;
  return picked.map(r => {
    const baseline = r.kind === "baseline";
    const color = baseline ? BASELINE_COLORS[base++ % BASELINE_COLORS.length] : PALETTE[rank++ % PALETTE.length];
    const pts = r.history.filter(p => p && Number.isFinite(p.day) && Number.isFinite(p.value)).map(p => ({ day: p.day, value: p.value }));
    const n = members(r);
    const more = Number.isInteger(n) && n > 1 ? ` +${n - 1}` : "";
    return { id: String(r.id), name: String(r.name) + more, color, baseline, running: r.status === "running", pts };
  });
}
// chartSeries:end

let geom = null;

function renderChart(data) {
  const start = data.window && typeof data.window.starting_cash === "number" ? data.window.starting_cash : 10000;
  const series = chartSeries(Array.isArray(data.rows) ? data.rows : [], tab);
  const W = Math.max(plot.clientWidth, 200), H = Math.max(plot.clientHeight, 140);
  const pad = { l: Math.max(Math.round(W * 0.085), 58), r: 14, t: 10, b: 28 };
  const values = [start, ...series.flatMap(s => s.pts.map(p => p.value))];
  let lo = Math.min(...values), hi = Math.max(...values);
  const span = Math.max(hi - lo, start * 0.004);
  lo -= span * 0.12; hi += span * 0.12;
  const x = (day) => pad.l + ((day - 1) / (DAYS - 1)) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b);
  geom = { x, y, series, pad, W, H };

  svg.replaceChildren();
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const grid = svgEl("g", { class: "grid" }, svg), axis = svgEl("g", { class: "axis" }, svg);
  for (let i = 0; i <= 4; i++) {
    const v = lo + ((hi - lo) * i) / 4, yy = y(v);
    svgEl("line", { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy }, grid);
    const t = svgEl("text", { x: pad.l - 8, y: yy + 4, "text-anchor": "end" }, axis);
    t.textContent = money(v);
  }
  for (let d = 1; d <= DAYS; d++) {
    const t = svgEl("text", { x: x(d), y: H - 8, "text-anchor": "middle" }, axis);
    t.textContent = "D" + d;
  }
  const ref = svgEl("g", { class: "ref" }, svg);
  svgEl("line", { x1: pad.l, x2: W - pad.r, y1: y(start), y2: y(start) }, ref);
  const rt = svgEl("text", { x: W - pad.r, y: y(start) - 6, "text-anchor": "end" }, ref);
  rt.textContent = money(start) + " start";

  for (const s of series) {
    const g = svgEl("g", { class: "series" + (s.baseline ? " baseline" : "") + (s.running ? " running" : "") }, svg);
    g.dataset.id = s.id;
    const path = s.pts.map(p => `${x(p.day).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
    svgEl("polyline", { points: path, stroke: s.color }, g);
    const last = s.pts[s.pts.length - 1];
    svgEl("circle", { class: "tip", cx: x(last.day), cy: y(last.value), r: s.running ? 5 : 3.5, fill: s.color }, g);
  }
  // Hidden until hovered: with the SVG's overflow visible, a parked cursor would show.
  svgEl("line", { class: "cursor", x1: -10, x2: -10, y1: pad.t, y2: H - pad.b, id: "cursor", visibility: "hidden" }, svg);
  applyFocus();
}

function setFocus(id) { focusId = id; applyFocus(); }

function applyFocus() {
  const id = pinnedId || focusId;
  plot.classList.toggle("focus", Boolean(id));
  for (const g of svg.querySelectorAll(".series")) g.classList.toggle("on", g.dataset.id === id);
  for (const li of list.children) if (li.dataset.k) li.classList.toggle("hl", li.dataset.k === id);
}

function showTip(event) {
  if (!geom || !geom.series.length) return;
  const box = svg.getBoundingClientRect();
  const px = ((event.clientX - box.left) / box.width) * geom.W, py = ((event.clientY - box.top) / box.height) * geom.H;
  const day = Math.min(DAYS, Math.max(1, Math.round(1 + ((px - geom.pad.l) / (geom.W - geom.pad.l - geom.pad.r)) * (DAYS - 1))));
  let best = null;
  for (const s of geom.series) {
    const p = s.pts.find(q => q.day === day);
    if (!p) continue;
    const d = Math.abs(geom.y(p.value) - py);
    if (!best || d < best.d) best = { s, p, d };
  }
  const cursor = document.getElementById("cursor");
  if (!best) { tip.hidden = true; return; }
  cursor.setAttribute("x1", geom.x(day)); cursor.setAttribute("x2", geom.x(day));
  cursor.setAttribute("visibility", "visible");
  focusId = best.s.id; applyFocus();
  tip.replaceChildren();
  const b = document.createElement("b");
  b.textContent = best.s.name;
  tip.appendChild(b);
  tip.appendChild(document.createTextNode(`Day ${day} · ${money(best.p.value)}`));
  tip.hidden = false;
  const left = Math.min((geom.x(day) / geom.W) * box.width + 14, box.width - tip.offsetWidth - 4);
  tip.style.left = `${Math.max(0, left)}px`;
  tip.style.top = `${Math.max(0, (geom.y(best.p.value) / geom.H) * box.height - tip.offsetHeight - 10)}px`;
}
plot.addEventListener("mousemove", showTip);
plot.addEventListener("mouseleave", () => { tip.hidden = true; const c = document.getElementById("cursor"); if (c) { c.setAttribute("x1", -10); c.setAttribute("x2", -10); c.setAttribute("visibility", "hidden"); } setFocus(null); });
addEventListener("resize", () => { fitPending(); if (lastData) renderChart(lastData); });

/* ---------- the replay tape: each day's top movers (bottom) ---------- */
const tape = $("tape"), track = $("track"), tapeLabel = $("tape-label");
let tapeDays = [], tapeIndex = 0, tapeWindow = null;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function renderTape() {
  if (!tapeDays.length) { tape.hidden = true; return; }
  const day = tapeDays[tapeIndex % tapeDays.length];
  const d = new Date(String(day.date) + "T12:00:00Z");
  tapeLabel.textContent = `Replay ${tapeWindow}` + (isNaN(d) ? "" : ` · ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`);
  const quote = (q) => {
    const span = document.createElement("span");
    const b = document.createElement("b"), close = document.createElement("span"), chg = document.createElement("em");
    b.textContent = String(q.symbol);
    close.textContent = Number.isFinite(q.close) ? q.close.toFixed(2) : "";
    const c = q.change_pct;
    chg.className = typeof c !== "number" ? "flat" : c > 0 ? "up" : c < 0 ? "down" : "flat";
    chg.textContent = typeof c === "number" ? pct(c) : "";
    span.append(b, close, chg);
    return span;
  };
  const quotes = Array.isArray(day.quotes) ? day.quotes : [];
  // Two copies so the CSS marquee loops seamlessly.
  track.replaceChildren(...quotes.map(quote), ...(RM ? [] : quotes.map(quote)));
  tape.hidden = false;
}

async function loadTickers() {
  try {
    const res = await fetch("/api/tickers", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    tapeDays = Array.isArray(data.days) ? data.days : [];
    tapeWindow = data.window ? windowLabel(data.window.start, data.window.end) : null;
    if (!tapeWindow) tapeDays = [];  // no window, no replay
  } catch (_) { tapeDays = []; }
  renderTape();
  if (!tapeDays.length) setTimeout(loadTickers, 30000);
}
setInterval(() => { if (tapeDays.length) { tapeIndex++; renderTape(); } }, TAPE_MS);
loadTickers();

/* ---------- header ---------- */
function renderHeader(data) {
  const w = data.window || {};
  const label = windowLabel(w.start, w.end);
  const universe = typeof w.universe === "string" ? w.universe : "";
  const cash = typeof w.starting_cash === "number" ? w.starting_cash : 10000;
  const days = Number.isInteger(w.days) && w.days > 0 ? w.days : null;
  $("sub-a").textContent = [universe, label || ""].filter(Boolean).join(" · ");
  $("sub-b").textContent = [`${money(cash)} each`, days ? `${days} trading days` : ""].filter(Boolean).join(" · ");
  $("sub-c").textContent = factoryText(data.factory);
}

new ResizeObserver(fitPending).observe(pendingList);

/* ---------- polling ---------- */
function render(data) {
  lastData = data;
  renderHeader(data);
  renderBoard(data);
  fitPending();
  renderChart(data);
}

async function poll() {
  try {
    const res = await fetch("/api/board", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    conn.hidden = true;
  } catch (_) {
    conn.hidden = false;
  } finally {
    setTimeout(poll, POLL_MS);
  }
}
renderTabs();
poll();
})();
</script>
<script>
// F3: pause and resume the house factory, for admins only. The public view builds nothing and
// calls no /api/admin route. /?admin shows a password field; a token the server accepts is kept
// in sessionStorage (this tab only) and sent only in the X-Bazaar-Admin-Token header, never in a
// URL. Browser telemetry ignores /api/admin/ requests, and the control carries rrweb's
// "rr-block" class, so session replay records neither the control nor the field.
(() => {
"use strict";
const KEY = "bazaar.admin";
const HEADER = "X-Bazaar-Admin-Token";
const HOUSE = "/api/admin/house";
const POLL_MS = 15000;
let root = null;

const saved = {
  get() { try { return sessionStorage.getItem(KEY); } catch (_) { return null; } },
  set(token) { try { sessionStorage.setItem(KEY, token); } catch (_) {} },
  clear() { try { sessionStorage.removeItem(KEY); } catch (_) {} },
};

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function admin(token, method, path) {
  return fetch(path, { method, headers: { [HEADER]: token }, cache: "no-store" });
}

const refused = (res) => res.status === 403 || res.status === 404;
const askedFor = () => new URLSearchParams(location.search).has("admin");

function dropAdminParam() {
  const url = new URL(location.href);
  if (!url.searchParams.has("admin")) return;
  url.searchParams.delete("admin");
  history.replaceState(history.state, "", url.pathname + url.search + url.hash);
}

function clearRoot() {
  if (root) root.remove();
  root = null;
}

// The house state for this token: the JSON on success, null when the server refuses it,
// undefined when the request failed.
async function check(token) {
  try {
    const res = await admin(token, "GET", HOUSE);
    if (refused(res)) return null;
    return res.ok ? await res.json() : undefined;
  } catch (_) {
    return undefined;
  }
}

function unlockForm() {
  clearRoot();
  const form = el("form", "adm rr-block");
  const input = el("input");
  input.type = "password";
  input.autocomplete = "off";
  input.placeholder = "admin token";
  input.setAttribute("aria-label", "Admin token");
  const button = el("button", null, "UNLOCK");
  button.type = "submit";
  const note = el("span", "adm-note");
  form.append(input, button, note);
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const token = input.value;
    input.value = "";
    button.disabled = true;
    note.textContent = "";
    const house = token ? await check(token) : null;
    dropAdminParam();
    if (house) {
      saved.set(token);
      control(token, house);
      return;
    }
    note.textContent = "not authorized";
    button.disabled = false;
  });
  root = form;
  document.body.append(form);
  input.focus();
}

function control(token, house) {
  clearRoot();
  const pill = el("div", "adm rr-block");
  const state = el("span", "adm-state");
  const button = el("button");
  button.type = "button";
  const lock = el("a", "adm-lock", "lock");
  lock.href = "#";
  pill.append(state, button, lock);
  root = pill;
  document.body.append(pill);
  let paused = false;
  let busy = false;
  let timer = null;
  const live = () => root === pill;
  const stop = () => { clearTimeout(timer); saved.clear(); if (live()) clearRoot(); };
  const show = (h) => {
    paused = Boolean(h.paused);
    state.textContent = paused ? "FACTORY: PAUSED" : "FACTORY: RUNNING";
    button.textContent = paused ? "RESUME" : "PAUSE";
    button.disabled = busy;
  };
  const refresh = async () => {
    const h = await check(token);
    if (!live()) return;
    if (h === null) return stop();
    if (h && !busy) show(h);
    timer = setTimeout(refresh, POLL_MS);
  };
  button.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    button.disabled = true;
    try {
      const res = await admin(token, "POST", paused ? HOUSE + "/resume" : HOUSE + "/pause");
      if (refused(res)) return stop();
      if (res.ok && live()) show(await res.json());
    } catch (_) {
      // unchanged; the next refresh shows the server's state
    } finally {
      busy = false;
      button.disabled = false;
    }
  });
  lock.addEventListener("click", (event) => { event.preventDefault(); stop(); });
  show(house);
  timer = setTimeout(refresh, POLL_MS);
}

async function start() {
  const token = saved.get();
  if (token) {
    const house = await check(token);
    if (house) {
      dropAdminParam();
      control(token, house);
      return;
    }
    if (house === null) saved.clear();  // refused: never shown again with this token
  }
  if (askedFor()) unlockForm();
}
start();
})();
</script>
