<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazaar Trading Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="/static/vendor/qrcode.min.js"></script>
<style>
@font-face { font-family: "Dwight"; src: url("/fonts/DwightMedium.woff2") format("woff2"); font-weight: 500; font-display: swap; }

/* Brand tokens (pydantic/brand). */
:root {
  color-scheme: dark;
  --lithium: #E520E9; --calcium: #FF6550; --purple: #9B77FF; --aqua: #77FFD8;
  --sugar: #FBFFEA; --darkpurple: #36182D; --petroleum: #092224; --blackbean: #061314;
  --display: "Dwight", "IBM Plex Sans", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --u: min(1vw, 1.7778vh);
}
html, body { height: 100%; }
body { margin: 0; background: var(--blackbean); font-family: var(--sans); }
*, *::before, *::after { box-sizing: border-box; }
.num { font-variant-numeric: tabular-nums; }
.spark { display: block; width: 100%; height: 100%; overflow: visible; }
.spark polyline { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.spark .zero { stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 2 3; opacity: .35; }
.qr svg { display: block; width: 100%; height: auto; }
.qr .qr-fallback { font: 500 12px/1.4 var(--mono); word-break: break-all; padding: 8px; }
.logo svg { display: block; width: 100%; height: auto; }

/* Trading floor: petroleum, mono numbers, market wire, tape */
.p-floor { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 85% 0%, #0f3336 0%, var(--petroleum) 45%, var(--blackbean) 100%); color: var(--sugar);
  display: grid; grid-template-columns: minmax(0, 1fr) calc(var(--u)*26); grid-template-rows: minmax(0,1fr) auto; gap: 0 calc(var(--u)*2.5); padding: calc(var(--u)*2.2) calc(var(--u)*2.6) 0; }
.fl-main { min-height: 0; display: flex; flex-direction: column; }
.fl-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2em; padding-bottom: calc(var(--u)*1.4); }
.fl-head h1 { font: 500 calc(var(--u)*4.4)/1 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.fl-head .meta { display: flex; gap: calc(var(--u)*1.6); margin-top: calc(var(--u)*.9); font: 400 calc(var(--u)*1.05)/1 var(--mono); color: #9fb6b4; }
.live { display: inline-flex; align-items: center; gap: .6em; font: 600 calc(var(--u)*1)/1 var(--mono); letter-spacing: .14em; color: var(--aqua); border: 1px solid rgba(119,255,216,.35); padding: .7em 1em; border-radius: 999px; white-space: nowrap; }
.live i { width: .6em; height: .6em; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
.live.off { color: var(--calcium); border-color: rgba(255,101,80,.45); }
.live.off i { animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(119,255,216,.6); } 100% { box-shadow: 0 0 0 .9em rgba(119,255,216,0); } }
.fl-cols, .fl-row { display: grid; grid-template-columns: calc(var(--u)*3.5) minmax(0, 1fr) calc(var(--u)*9) calc(var(--u)*8.5) calc(var(--u)*8) calc(var(--u)*4); align-items: center; gap: calc(var(--u)*1.2); }
.fl-cols { font: 500 calc(var(--u)*.8)/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #6f8a88; padding: 0 calc(var(--u)*1.2) calc(var(--u)*.7); border-bottom: 1px solid rgba(251,255,234,.12); }
.fl-cols span:nth-child(n+4) { text-align: right; }
.fl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.fl-row { padding: calc(var(--u)*.85) calc(var(--u)*1.2); border-radius: calc(var(--u)*.6); }
.fl-row + .fl-row { box-shadow: inset 0 1px 0 rgba(251,255,234,.06); }
.fl-row .rk { font: 500 calc(var(--u)*2)/1 var(--display); color: #6f8a88; }
.fl-row.lead .rk { color: var(--lithium); }
.fl-row.lead { background: linear-gradient(90deg, rgba(229,32,233,.16), rgba(229,32,233,0) 70%); }
.fl-row .nm { min-width: 0; }
.fl-row .nm b { display: block; font: 600 calc(var(--u)*1.55)/1.15 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-row .nm b a { color: inherit; text-decoration: none; cursor: pointer; }
.fl-row .nm small { display: block; font: 400 calc(var(--u)*.9)/1.3 var(--mono); color: #7e9896; margin-top: .25em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-row .sp { height: calc(var(--u)*2.6); }
.fl-row .ret { font: 600 calc(var(--u)*1.9)/1 var(--mono); text-align: right; }
.fl-row .xs, .fl-row .fills { font: 400 calc(var(--u)*1.15)/1 var(--mono); text-align: right; color: #a9bdbb; }
.fl-row.st-queued, .fl-row.st-failed { opacity: .62; }
.st { margin-right: .8em; }
.st-running .st { color: var(--aqua); }
.st-failed .st { color: var(--calcium); }
.empty { font: 500 calc(var(--u)*2.2)/1.3 var(--display); color: #9fb6b4; padding: calc(var(--u)*4) calc(var(--u)*1.2); }
.up { color: var(--aqua); } .down { color: var(--calcium); } .flat { color: #a9bdbb; }
.fl-side { min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u)*1.8); }
.fl-side .logo { width: 100%; --logo-text: var(--sugar); --logo-mark: var(--lithium); padding-top: calc(var(--u)*.4); }
.fl-qr { display: grid; grid-template-columns: calc(var(--u)*11) 1fr; gap: calc(var(--u)*1.4); align-items: center; background: var(--sugar); color: var(--darkpurple); border-radius: calc(var(--u)*1.2); padding: calc(var(--u)*1.2); }
.fl-qr h2 { font: 500 calc(var(--u)*1.9)/1.05 var(--display); margin: 0 0 .35em; }
.fl-qr p { font: 400 calc(var(--u)*1.0)/1.35 var(--sans); margin: 0; color: #5b4453; }
.fl-qr .url { font: 500 calc(var(--u)*.78)/1.3 var(--mono); color: #8a6f80; margin-top: .7em; word-break: break-all; }
.wire { min-height: 0; flex: 1; display: flex; flex-direction: column; }
.wire h3 { font: 500 calc(var(--u)*.85)/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #6f8a88; margin: 0 0 calc(var(--u)*.8); }
.wire ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.55); overflow: hidden; }
.wire li { font: 400 calc(var(--u)*1.05)/1.35 var(--sans); color: #c9d6cf; display: grid; grid-template-columns: calc(var(--u)*5.2) 1fr; gap: .6em; }
.wire li time { font: 400 calc(var(--u)*.85)/1.6 var(--mono); color: #6f8a88; }
.fl-tape { grid-column: 1 / -1; margin: calc(var(--u)*1.4) calc(var(--u)*-2.6) 0; border-top: 1px solid rgba(251,255,234,.1); background: rgba(6,19,20,.7); overflow: hidden; white-space: nowrap; min-height: calc(var(--u)*3); }
.tape-track { display: inline-flex; gap: calc(var(--u)*3); padding: calc(var(--u)*.9) 0; animation: tape 40s linear infinite; font: 500 calc(var(--u)*1.1)/1 var(--mono); }
.tape-track span b { color: var(--sugar); font-weight: 500; margin-right: .6em; }
@keyframes tape { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tape-track, .live i { animation: none; } }

@media (max-width: 760px) {
  :root { --u: 5.2px; }
  .p-floor { position: relative; min-height: 100%; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; }
  .fl-cols { display: none; }
  .fl-row { grid-template-columns: 26px minmax(0,1fr) 72px; }
  .fl-row .sp, .fl-row .xs, .fl-row .fills { display: none; }
  .fl-tape { margin: 0 -16px; }
}
</style>
</head>
<body>
<section class="p-floor">
  <div class="fl-main">
    <div class="fl-head">
      <div>
        <h1>Bazaar Agent Leaderboard</h1>
        <div class="meta"><span id="period">Feb 2 to 13, 2026</span><span id="cash">$10,000 starting cash</span><span id="symbols">AAPL MSFT KO</span></div>
      </div>
      <span class="live" id="live"><i></i><span>LIVE</span></span>
    </div>
    <div class="fl-cols"><span>#</span><span>Strategy</span><span>Return path</span><span>Return</span><span>vs buy and hold</span><span>Fills</span></div>

  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c) && !finder(r, c) && !inHole(r, c)) d += `M${c + pad + .08} ${r + pad + .08}h.84v.84h-.84z`;
  const eye = (r, c) => `<rect x="${c + pad + .5}" y="${r + pad + .5}" width="6" height="6" rx="1.6" fill="none" stroke="${fg}" stroke-width="1"/><rect x="${c + pad + 2}" y="${r + pad + 2}" width="3" height="3" rx=".8" fill="${fg}"/>`;
  const m = hole - 1.2, mx = h0 + pad + .6, my = h0 + pad + .6;
  return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code for ${esc(url)}"><rect width="${size}" height="${size}" fill="none"/><path d="${d}" fill="${fg}"/>${eye(0, 0)}${eye(0, n - 7)}${eye(n - 7, 0)}<svg x="${mx}" y="${my}" width="${m}" height="${m}" viewBox="0 0 139 121"><path fill="${mark}" d="${MARK_D}"/></svg></svg>`;
}

/* ---------- render ---------- */
const $ = (id) => document.getElementById(id);
const list = $("list"), wire = $("wire"), tape = $("tape"), live = $("live");
$("logo").innerHTML = LOGO_SVG;
$("qr").innerHTML = qrSVG(SUBMIT_URL, "#36182D", "#E520E9");
$("url").textContent = SUBMIT_URL.replace(/^https?:\/\//, "");
let tapeKey = null;

function visibleRows(rows) {
  // Rows arrive ranked. Keep in-flight runs on screen even when many runs are scored.
  const scored = rows.filter(r => r.status === "scored");
  const inflight = rows.filter(r => r.status === "running").concat(rows.filter(r => r.status === "queued").slice(0, 2));
  const failed = rows.filter(r => r.status === "failed");
  const shown = scored.slice(0, Math.max(0, MAX_ROWS - inflight.length)).concat(inflight);
  return shown.concat(failed.slice(0, Math.max(0, MAX_ROWS - shown.length)));
}

function header(w) {
  if (!w) return;
  const s = new Date(w.start + "T00:00:00Z"), e = new Date(w.end + "T00:00:00Z");
  if (!isNaN(s) && !isNaN(e)) {
    const same = s.getUTCMonth() === e.getUTCMonth();
    $("period").textContent = `${MONTHS[s.getUTCMonth()]} ${s.getUTCDate()} to ${same ? "" : MONTHS[e.getUTCMonth()] + " "}${e.getUTCDate()}, ${e.getUTCFullYear()}`;
  }
  if (typeof w.starting_cash === "number") $("cash").textContent = "$" + w.starting_cash.toLocaleString("en-US", { maximumFractionDigits: 0 }) + " starting cash";
  if (Array.isArray(w.symbols)) $("symbols").textContent = w.symbols.join(" ");
}

function render(data) {
  header(data.window);
  const rows = visibleRows(Array.isArray(data.rows) ? data.rows : []);
  if (!rows.length) {
    list.innerHTML = '<li class="empty">Scan to submit the first strategy</li>';
  } else {
    if (list.querySelector(".empty")) list.innerHTML = "";
    reconcile(list, rows.map(r => ({ ...r, id: String(r.id) })), () => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="rk num"></span><span class="nm"><b></b><small><span class="st"></span><span class="hd"></span></small></span><span class="sp"></span><span class="ret num"></span><span class="xs num"></span><span class="fills num"></span>`;
      return li;
    }, (li, r) => {
      const status = STATUSES.has(r.status) ? r.status : "failed";
      li.className = `fl-row st-${status}` + (r.rank === 1 ? " lead" : "");
      li.querySelector(".rk").textContent = r.rank ?? "";
      setName(li.querySelector(".nm b"), r.name, safeUrl(r.logfire_url));
      li.querySelector(".st").textContent = statusText({ ...r, status });
      li.querySelector(".hd").textContent = r.handle || (r.kind === "baseline" ? "baseline" : "");
      li.querySelector(".sp").innerHTML = sparkSVG(r.history, (r.return_pct ?? 0) >= 0 ? "#77FFD8" : "#FF6550");
      const ret = li.querySelector(".ret");
      ret.className = "ret num " + dir(r.return_pct);
      if (typeof r.return_pct === "number") countTo(ret, r.return_pct, pct); else { ret._v = undefined; ret.textContent = DASH; }
      const xs = li.querySelector(".xs");
      xs.className = "xs num " + dir(r.excess_pct);
      xs.textContent = typeof r.excess_pct === "number" ? pct(r.excess_pct) : DASH;
      li.querySelector(".fills").textContent = typeof r.fills === "number" ? r.fills : DASH;
    });
  }

  const events = Array.isArray(data.events) ? data.events : [];
  wire.innerHTML = events.slice(0, 10).map(ev => {
    const d = new Date(ev.t);
    const t = isNaN(d) ? "" : d.toTimeString().slice(0, 8);
    return `<li><time>${esc(t)}</time><span>${esc(ev.text)}</span></li>`;
  }).join("");

  const scored = (data.rows || []).filter(r => r.status === "scored" && typeof r.return_pct === "number");
  const key = scored.map(r => `${r.id}:${r.return_pct}`).join();
  if (key !== tapeKey) {
    tapeKey = key;
    const one = scored.map(r => `<span><b>${esc(r.name)}</b><em class="${dir(r.return_pct)} num">${pct(r.return_pct)}</em></span>`).join("");
    tape.innerHTML = one + one;
  }
}

async function poll() {
  try {
    const res = await fetch("/api/board", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    live.classList.remove("off");
    live.lastElementChild.textContent = "LIVE";
  } catch (_) {
    live.classList.add("off");
    live.lastElementChild.textContent = "RECONNECTING";
  } finally {
    setTimeout(poll, POLL_MS);
  }
}
poll();
})();
</script>
</body>
</html>
