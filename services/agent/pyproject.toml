[project]
name = "bazaar-agent"
version = "0.1.0"
description = "Trading agent harness. Seller and buyer run as two instances of this image."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_agent"]
