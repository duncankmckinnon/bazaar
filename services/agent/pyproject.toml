[project]
name = "bazaar-agent"
version = "0.1.0"
description = "Trading agent harness. Seller and buyer run as two instances of this image."
requires-python = ">=3.12"
dependencies = [
    "bazaar-protocol",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-ai-slim==1.70.0",
    "logfire[fastapi,httpx,sqlite3,system-metrics]>=5.1.1",
    "uvicorn>=0.30",
]

[tool.uv.sources]
bazaar-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_agent"]
