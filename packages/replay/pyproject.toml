[project]
name = "bazaar-replay"
version = "0.1.0"
description = "Counterfactual replay and paired strategy comparisons."
requires-python = ">=3.12"
dependencies = ["bazaar-protocol"]

[tool.uv.sources]
bazaar-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_replay"]
