[project]
name = "bazaar-protocol"
version = "0.1.0"
description = "Shared market and trading-agent API contracts."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_protocol"]
